name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : le workflow lit le dépôt, il n'a besoin d'écrire nulle part.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente, devenue obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Vide si le secret n'existe pas (ou pour une PR venant d'un fork) : l'analyse est alors sautée.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet : SonarCloud s'en sert pour savoir quel code est nouveau.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      # Seulement si une étape précédente a échoué : on peut lire les rapports sans relancer le build.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      # Envoie l'analyse et la couverture (target/site/jacoco/jacoco.xml) à SonarCloud.
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B sonar:sonar

      # Vérifie que le Dockerfile fonctionne avec le jar produit par "verify" (image construite, pas publiée).
      - name: Build Docker image
        run: docker build --tag quizapp:ci .

  # Front Angular : job séparé, lancé en parallèle du build Java. Si l'un casse, on sait tout de suite lequel.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Met en cache le dossier npm, clé calculée à partir du lockfile (comme "cache: maven" pour Java).
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # "npm ci" installe exactement les versions de package-lock.json (et échoue s'il n'est pas à jour) :
      # le build est reproductible, contrairement à "npm install" qui peut mettre le lockfile à jour.
      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
