spring.application.name=quizapp

# Contexts Liquibase actifs. Attention : sans context déclaré, Liquibase exécute TOUS les changesets,
# y compris ceux marqués "demo". On déclare donc toujours "main" ; les données de démo
# ne sont ajoutées que par le profil "local" (application-local.properties).
spring.liquibase.contexts=main

# Spring Batch : le schéma de ses tables est géré par Liquibase (changeset 005), pas par Spring Boot.
spring.batch.jdbc.initialize-schema=never
# Aucun job ne démarre tout seul au lancement de l'application : l'import se déclenche sur demande.
spring.batch.job.enabled=false

# Dossier privé (droits 700, créé au démarrage) où sont déposés les fichiers reçus par POST /api/imports.
# Surchargé dans l'image Docker par la variable d'environnement QUIZAPP_IMPORT_UPLOAD_DIR.
quizapp.import.upload-dir=${java.io.tmpdir}/quizapp-imports
