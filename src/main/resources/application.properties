spring.application.name=quizapp

# Contexts Liquibase actifs. Attention : sans context déclaré, Liquibase exécute TOUS les changesets,
# y compris ceux marqués "demo". On déclare donc toujours "main" ; les données de démo
# ne sont ajoutées que par le profil "local" (application-local.properties).
spring.liquibase.contexts=main
