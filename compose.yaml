# Environnement local.
# - Développement : `./mvnw spring-boot:run` démarre automatiquement PostgreSQL seul
#   (module spring-boot-docker-compose), ou à la main avec `docker compose up -d`.
# - Application complète dans Docker : `./mvnw package` puis `docker compose --profile app up --build`.
# Identifiants de développement uniquement : rien n'est exposé hors de la machine.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: quizapp
      POSTGRES_USER: quizapp
      POSTGRES_PASSWORD: quizapp
    ports:
      # Port 5433 côté machine (le 5432 est souvent déjà pris par un PostgreSQL local),
      # accessible depuis cette machine seulement.
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 range ses données dans /var/lib/postgresql/18/docker : on monte le dossier parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizapp -d quizapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Rangé dans le profile "app" : `docker compose up` et `spring-boot:run` ne démarrent que PostgreSQL.
    profiles: [app]
    build: .
    image: quizapp:local
    depends_on:
      postgres:
        condition: service_healthy   # attendre que PostgreSQL accepte les connexions (healthcheck ci-dessus)
    environment:
      SPRING_PROFILES_ACTIVE: local  # données de démo (context Liquibase "demo")
      # Dans le réseau de Compose, la base s'appelle « postgres » (nom du service) et écoute sur 5432.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quizapp
      SPRING_DATASOURCE_USERNAME: quizapp
      SPRING_DATASOURCE_PASSWORD: quizapp
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
